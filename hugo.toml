[params]
  description = "go-embedded-r (in development, r v0.14.1: milestones M0, the oracle harness, M1, the parser with deparse, and M2, the evaluator, are done; M3, base R, is in progress, 40.8 % of base's exports agreeing with R; M4 to M8 are planned): an R interpreter in pure Go that can be embedded, for the r cells of go-notebook and its WebAssembly playground."

# Every field below is rendered by layouts/index.html. A field nothing renders
# does not stay true. Every statement is from the README of go-embedded-r/r at
# main (v0.14.1), docs/m2-design.md and docs/m3-plan.md, and from the plan it links, bib/r.md (go-scikit/roadmap).
[[params.repos]]
  name  = "r"
  kind  = "source"
  href  = "https://github.com/go-embedded-r/r"
  blurb = "The interpreter, <code>github.com/go-embedded-r/r</code>, released as v0.14.1 (2026-11-10): M0, the oracle harness against GNU R 4.6.2 (<code>internal/oracle</code>, <code>cmd/roracle</code>, the <code>rds</code> serialization reader and writer, golden files), M1, the parser and <code>deparse</code> (package <code>syntax</code>), and M2, the evaluator (package <code>eval</code>, 175 of 210 primitives, regular expressions on the tre module). M3, base R, is in progress (40.8 % of base's exports agree with R; slices 5 to 11: vectors, strings, conditions and the call stack, environments and namespaces, dates and times, connections and files, matrices, arrays and grouping). Everything after is planned."
[[params.repos]]
  name  = "tre"
  kind  = "library"
  href  = "https://github.com/go-embedded-r/tre"
  blurb = "A pure-Go port of TRE, the POSIX regular expression engine R uses for its default patterns, released as v0.1.3 (2026-11-07; v0.1.1 added a lazy DFA for yes/no matches, v0.1.2 and v0.1.3 bound the DFA and the compile memory, so some extreme patterns R accepts are refused; every bomb test stays under 256 MiB on every target, wasm included): leftmost-longest, lazy quantifiers, back-references, <code>\\&lt;</code> <code>\\&gt;</code>. BSD 2-Clause with the TRE notice kept. <code>Options.RCompat</code> reproduces R 4.6.2's own copy of TRE. Not ported: approximate matching. Open (issue 3): <code>grepl</code> was 1.44 times slower than R when last measured; v0.1.1 took the engine's <code>grepl</code> case from 5.95 ms to 0.69 ms, and the ratio against R is not yet re-measured."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-embedded-r.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the plan and its milestones, what the repository holds today, the parser's parity with R 4.6.2, and the licence rule. <a href=\"https://github.com/go-embedded-r/docs\">Source →</a>"

# The cards of #scope.
[[params.scope]]
  name = "An R interpreter in pure Go"
  what = "<code>github.com/go-embedded-r/r</code> is the start of an R implementation written in Go (<code>CGO_ENABLED=0</code>), meant to be embedded in Go programs and to run in the browser through WebAssembly."
[[params.scope]]
  name = "For go-notebook"
  what = "It will back the <code>r</code> cells of go-notebook, the way julia backs its Julia cells and rbgo its Ruby cells."
[[params.scope]]
  name = "R is the oracle"
  what = "Every stage is checked against the reference implementation, the pinned <b>GNU R 4.6.2</b> (CRAN tarball, SVN revision 90784), never against expectations written by hand. R runs as a black box and what it prints is recorded."
[[params.scope]]
  name = "R cells in go-notebook, parsed not run"
  what = "R cells are live in <a href=\"https://github.com/go-notebook/notebook/releases/tag/v0.8.0\">go-notebook v0.8.0</a> and <a href=\"https://github.com/go-notebook/playground/releases/tag/v0.9.0\">playground v0.9.0</a>: they are parsed and checked, not run yet. Running them needs the evaluator, which is planned."
[[params.scope]]
  name = "A parser and deparse, today"
  what = "Package <code>syntax</code>: lexer, parser, an AST with a source map, the tokens of <code>getParseData()</code>, R's own parse errors byte for byte, <code>Deparse</code>, and <code>TopLevelNames</code>, which names what a cell assigns and reads."
[[params.scope]]
  name = "A complete evaluator, base R started"
  what = "Package <code>eval</code> (v0.14.1): 175 of R's 210 primitives and 110 base closures plus a base library, string functions, restarts, the call stack, locked and active bindings, a one-namespace model for base (no package loading), and <code>Date</code>, <code>POSIXct</code>, <code>POSIXlt</code> and <code>difftime</code> with time zones from Go's embedded IANA database, with replacement, subsetting, attributes, S3 dispatch, conditions, <code>print</code>, environments, the apply family, strings, regular expressions, the math group and factors, judged by the oracle (2 737 goldens, 9 of them macOS-only). Its API, <code>eval.NewSession</code> and <code>Eval</code>, is bounded by default since v0.4.0 (30 000 000 steps, 16 GiB of cumulative allocation, 10 s; <code>eval.Unbounded</code> opts out), a breaking change."
[[params.scope]]
  name = "The serialization format"
  what = "<code>rds</code> reads and writes R's serialization format (XDR, versions 2 and 3, gzip or bzip2): a decoded value encodes back to the same bytes. The decoder is built for untrusted input and fuzzed."
[[params.scope]]
  name = "A private file system by default"
  what = "Since v0.13.0 a session's files are an in-memory tree the host never sees; <code>Options.FileRoot</code> gives a host directory as root, confined with <code>os.OpenRoot</code> (tested against <code>..</code>, absolute paths, symbolic links out of the root, symbolic-link swap races and Windows path forms). <code>Sys.getenv</code> reads the session's own table, never the host's environment. File size, entries (65 536), path length (4 096 bytes) and depth (256) are bounded."
[[params.scope]]
  name = "Clean room, BSD-3-Clause"
  what = "R's sources are GPL-2-or-later. R is an oracle, never a source: no R source file, test file, help page or transcript is copied here, and base R's R code is rewritten from the documented behaviour, not copied. Since v0.12.2 a similarity checker (token winnowing, calibrated on independent code) gates every file of the base library in CI, the oracle refuses to print base closures or any copy of one (since v0.12.3, at any size), and every change records its provenance. The gate is a floor, not proof."

# The cards of #milestones, in order. state is "done" or "planned".
[[params.milestones]]
  id    = "M0"
  name  = "Oracle harness"
  state = "done"
  what  = "<code>internal/oracle</code> starts one <code>Rscript --vanilla</code> process (the pinned release; any other version is refused) and talks to it in R's own serialization; <code>rds</code> reads and writes that format; <code>cmd/roracle</code> regenerates the golden files. The tests replay the goldens without R, and with R they check that R reads Go's bytes back unchanged."
[[params.milestones]]
  id    = "M1"
  name  = "Parser and deparse"
  state = "done"
  what  = "Package <code>syntax</code>: the parser in v0.1.0, <code>deparse</code> in v0.2.0. <code>syntax.ParseAll(src)</code>, <code>syntax.TopLevelNames(cell)</code> and <code>syntax.Deparse(expr, nil)</code>. Tree, tokens, error text and deparse output are compared with R 4.6.2 (see the parity table below). Bounded in bytes, depth and nodes. Known gaps: the effect of <code>#line</code> directives on later error lines, <code>parse(file=)</code> encoding options, and the platform divergences of numeric constants in deparse (<code>exp10</code> on macOS, 80-bit <code>long double</code> on x86-64)."
[[params.milestones]]
  id    = "M2"
  name  = "Evaluator core"
  state = "done"
  what  = "Package <code>eval</code>, complete in v0.7.0 (slices 1 to 4; limits bounded by default since v0.4.0, regex on a port of TRE since v0.6.0). Slice 1: values, environments, promises, closures, control flow, arithmetic. Slice 2: replacement with copy-on-modify, subsetting, attributes, S3 dispatch, conditions, <code>print</code>, the <code>Eval</code> API with limits. Slice 3: environments as values, the apply family, string functions, regular expressions. Slice 4: the math group, factors and matching, <code>switch</code>, <code>substitute</code>, collation. <b>175 of R's 210 primitives</b> and 110 base closures; the other 35 (complex, raw, S4, formula and expression types, foreign calls, <code>.Internal</code>) are refused with an error that says why. Judged by the oracle: 2 737 goldens, 189 998 of 190 000 arithmetic fuzz expressions, 35 963 of 36 000 subsetting, 60 000 of 60 000 regex, 18 000 of 18 000 vectors, 16 000 of 16 000 strings, 10 000 of 10 000 sprintf and format, 16 294 of 16 294 compared connections and files (one counted exclusion), 13 142 of 13 142 compared environments and 16 152 of 16 152 compared dates and times (both with counted exclusions), 20 000 of 20 000 math (libm within 4 ulp, largest seen 2; <code>lgamma</code>, <code>digamma</code> and <code>trigamma</code> are less accurate than R's, an open defect; <code>mean</code> sums in float64 where R uses long double). Known divergences: regex has no approximate matching, non-ASCII classes use Go's Unicode tables, <code>perl = TRUE</code> is refused, <code>grepl</code> was 1.44 times slower than R at the last measurement (open defect; tre v0.1.1 sped the engine up and the ratio is not yet re-measured); strings outside Latin script collate by code point; function printing; <code>conditionCall</code> inside a top-level <code>try</code> or <code>tryCatch</code> and <code>match.call(expand.dots = FALSE)</code> differ from R; dates and times use the C locale only and differ from R on some <code>tzone</code> attributes and on local times a daylight-saving change skips or repeats; there is no package loading (<code>library</code>, <code>require</code>, <code>attach</code>), and packages other than base resolve through the base environment; some <code>[[&lt;-</code> messages. The design is <code>docs/m2-design.md</code> of go-embedded-r/r."
[[params.milestones]]
  id    = "M3"
  name  = "Base R, clean room"
  state = "in progress"
  what  = "Started in v0.7.0; v0.9.0 and v0.9.1 (slice 6) added string and format functions, v0.10.0 (slice 7) restarts, <code>sys.*</code> and <code>match.call</code>, v0.11.0 (slice 8) environments and namespaces, v0.12.0 and v0.12.1 (slice 9) dates and times, v0.13.0 and v0.13.1 (slice 10) connections and files, and v0.14.0 and v0.14.1 (slice 11) matrices, arrays and grouping (<code>apply</code>, <code>sweep</code>, <code>scale</code>, <code>aperm</code>, <code>split</code>, <code>tapply</code>, <code>rle</code>); a function whose blind R draft fails the similarity gate becomes a Go native, never reshaped in R. v0.8.0 (slice 5) added our own base library, R glue in <code>eval/baselib/*.R</code> (BSD) plus Go natives (<code>as.vector</code>, <code>order</code>, <code>rank</code>, <code>pmax</code>, <code>pmin</code>, <code>which.max</code>, <code>tabulate</code>, row and column sums, <code>t</code>, <code>diag</code>, <code>mean</code>, <code>stopifnot</code>). The rest of what <code>library(base)</code> exports (1 152 closures) is rewritten under the BSD licence and never copied. Measured by <code>go run ./cmd/rparity basecov</code>: <b>40.8 %</b> of base's 1 362 exports (556) agree with R 4.6.2, against 37.7 % at v0.13.0, 33.9 % at v0.12.0, 26.4 % at v0.11.0, 24.4 % at v0.10.0, 23.3 % at v0.9.0, 22.2 % at v0.8.0, 19.8 % at v0.7.0 and 14.4 % at v0.6.0; a function counts when the evaluator implements it and a passing golden exercises it. The plan is <code>docs/m3-plan.md</code> of go-embedded-r/r."
[[params.milestones]]
  id    = "M4 – M8"
  name  = "Stats, graphics, notebook bridge, wasm playground, CRAN ports"
  state = "planned"
  what  = "Planned, not started: stats, graphics, the notebook bridge, the WebAssembly playground and CRAN ports. The plan is <code>bib/r.md</code> of go-scikit/roadmap."

# The rows of #parity: the table of the README of go-embedded-r/r on main (v0.14.1).
[[params.parity]]
  name = "R's base packages: 842 files"
  what = "Every <code>.R</code> file of <code>src/library</code> (7.8 MB): 844 inputs, 842 parse and 2 are rejected. Tree <b>842 / 842</b>, tokens <b>842 / 842</b>, deparse <b>842 / 842</b>, error text byte for byte <b>2 / 2</b>. On R's <code>tests/</code> (90 files that parse): tree, tokens and deparse <b>90 / 90</b>. Deparse differs from R in the last digit for 5 of 100 000 random literals beyond exponent 200 (<code>exp10</code> on macOS), and, on x86-64 Linux, in 6 of the 90 files of <code>tests/</code> (80-bit <code>long double</code>)."
[[params.parity]]
  name = "R's tests: 94 files"
  what = "95 files, 1 is not UTF-8 and is skipped: 94 inputs, 90 parse and 4 are rejected. Tree <b>90 / 90</b>, tokens <b>90 / 90</b>, error text <b>4 / 4</b>."
[[params.parity]]
  name = "Our own corpora"
  what = "42 snippets: tree and tokens 42 / 42. 52 error cases: 51 / 51 identical error texts. 93 edge cases (Unicode, raw strings, <code>|></code>, <code>\\(x)</code>, <code>->></code>, hex, <code>L</code> and <code>i</code> numbers): 90 / 90, errors 3 / 3. 117 odd inputs (CRLF, tabs, bidi controls, invalid UTF-8): 81 / 81, errors 36 / 36."
[[params.parity]]
  name = "190 000 differential fuzz inputs"
  what = "Random edits of lines of R's sources (seeds 1, 2 and 11), about two thirds rejected: tree, tokens and error text all identical."
[[params.parity]]
  name = "100 000 decimal literals"
  what = "Random, up to 20 digits, exponents -330 to 330: 100 000 identical doubles. They match R on macOS arm64 (fused multiply-add, 64-bit <code>long double</code>); R on x86-64 Linux accumulates in 80-bit precision and can differ in the last place. Those literals are compared within 16 ulp and kept out of the goldens."
[[params.parity]]
  name = "Speed: 0.80 of R"
  what = "One core each, interleaved rounds, median of 11, 1-minute load 7.8 on an Apple M-series laptop: the 842 files of <code>src/library</code> (7.8 MB) take 0.214 s in Go (<code>syntax.ParseAll</code>, which also builds the source map and the token list) and 0.269 s in R's <code>parse(text =, keep.source = FALSE)</code>. Go/R = 0.80."

